<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== CSS Variables (Soft UI) ===== */
:root {
  --bg: #fafaf7;
  --bg-soft: #ffffff;
  --bg-softer: #f5f5f0;
  --border: #e5e5e0;
  --border-strong: #d4d4cf;
  --text: #1a1a1a;
  --text-soft: #666666;
  --text-mute: #999999;
  --accent: #1a1a1a;
  --accent-soft: #f0f0ec;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #dc2626;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Unbounded', sans-serif;
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #0f0f0f;
  --bg-soft: #1a1a1a;
  --bg-softer: #141414;
  --border: #262626;
  --border-strong: #333333;
  --text: #f5f5f0;
  --text-soft: #a0a0a0;
  --text-mute: #666666;
  --accent: #f5f5f0;
  --accent-soft: #1f1f1f;
}

[data-theme="spring"] {
  --bg: #f8fdf8;
  --bg-soft: #ffffff;
  --bg-softer: #f0f7f4;
  --border: #c8e6c9;
  --border-strong: #a5d6a7;
  --text: #1b5e20;
  --text-soft: #2e7d32;
  --text-mute: #4caf50;
  --accent: #2e8b57;
  --accent-soft: #e1f0e8;
  --success: #4caf50;
  --warning: #ff9800;
  --danger: #ef5350;
}

/* ===== Reset & Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: var(--transition);
  line-height: 1.5;
  overflow-x: hidden;
}

/* ===== Layout ===== */
.app-container {
  display: grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

/* ===== Header ===== */
.header {
  grid-column: 1 / -1;
  background: var(--bg-softer);
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  color: var(--bg);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.logo-text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.5px;
  color: var(--text);
}

/* ===== Sidebar ===== */
.sidebar {
  background: var(--bg-soft);
  border-right: 1px solid var(--border);
  padding: 24px;
  height: calc(100vh - 77px);
  position: sticky;
  top: 77px;
  overflow-y: auto;
}

.sidebar-section { margin-bottom: 32px; }
.sidebar-section:last-child { margin-bottom: 0; }

.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-mute);
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.section-title i {
  background: var(--accent-soft);
  color: var(--text);
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

/* ===== Main Content ===== */
.main-content {
  padding: 32px;
  background: var(--bg);
  overflow-y: auto;
}

.content-header { margin-bottom: 24px; }

.page-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 8px;
}

.page-subtitle {
  color: var(--text-soft);
  font-size: 14px;
  max-width: 600px;
}

/* ===== Cards ===== */
.card {
  background: var(--bg-soft);
  border-radius: var(--radius-lg);
  padding: 24px;
  border: 1px solid var(--border);
  transition: var(--transition);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.card-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  background: var(--bg-soft);
  color: var(--text);
}

.btn:hover {
  background: var(--accent-soft);
  border-color: var(--border-strong);
}

.btn-primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.btn-primary:hover {
  opacity: 0.85;
  background: var(--text);
  color: var(--bg);
}

.btn-secondary {
  background: var(--bg-softer);
  color: var(--text-soft);
}

.btn-secondary:hover {
  background: var(--accent-soft);
  color: var(--text);
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 50%;
}

/* ===== Forms ===== */
.form-group { margin-bottom: 20px; }

.form-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-mute);
  font-weight: 600;
  margin-bottom: 8px;
}

.form-label i { color: var(--text-mute); font-size: 12px; }

.select-wrapper { position: relative; }

select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-soft);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  appearance: none;
  cursor: pointer;
  transition: var(--transition);
  outline: none;
}

select:focus { border-color: var(--text); }

/* ===== File Upload ===== */
.file-upload {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px 16px;
  text-align: center;
  transition: var(--transition);
  cursor: pointer;
  background: var(--bg-softer);
}

.file-upload:hover {
  border-color: var(--text);
  background: var(--accent-soft);
}

.file-upload.drag-over {
  border-color: var(--text);
  background: var(--accent-soft);
  border-style: solid;
}

.upload-icon {
  font-size: 32px;
  color: var(--text-mute);
  margin-bottom: 12px;
}

.upload-text {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 4px;
}

.upload-subtext {
  font-size: 12px;
  color: var(--text-mute);
}

/* ===== Chart Container ===== */
.chart-container {
  background: var(--bg-softer);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid var(--border);
  height: 400px;
  position: relative;
}

.chart-wrapper {
  position: relative;
  height: 100%;
  width: 100%;
}

/* ===== File List ===== */
.file-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}

.file-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--bg-softer);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-soft);
  border: 1px solid var(--border);
  transition: var(--transition);
  cursor: pointer;
}

.file-chip.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.file-chip:hover:not(.active) {
  border-color: var(--border-strong);
  background: var(--accent-soft);
}

.file-chip-remove {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  padding: 4px;
  margin-left: auto;
  opacity: 0.6;
  transition: opacity 0.2s;
}

.file-chip-remove:hover { opacity: 1; }

/* ===== Control Panel ===== */
.control-panel {
  position: fixed;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
}

.control-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text-soft);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: var(--transition);
}

.control-btn:hover {
  background: var(--accent-soft);
  color: var(--text);
  border-color: var(--border-strong);
}

.control-btn.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.control-btn.snow-hidden { display: none !important; }

/* ===== Toast Notifications ===== */
.toast-container {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
}

.toast {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  background: var(--bg-soft);
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 400px;
  animation: slideInRight 0.3s ease;
  pointer-events: auto;
  font-size: 13px;
  font-weight: 500;
}

.toast.success { border-color: rgba(16, 185, 129, 0.3); color: var(--success); }
.toast.error { border-color: rgba(220, 38, 38, 0.3); color: var(--danger); }
.toast.info { border-color: rgba(102, 126, 234, 0.3); color: var(--text); }

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ===== Modals ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  padding: 20px;
}

.modal.show { display: flex; animation: fadeIn 0.2s ease; }

.modal-content {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 600px;
  width: 100%;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.modal-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-mute);
  cursor: pointer;
  font-size: 24px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.modal-close:hover {
  background: var(--accent-soft);
  color: var(--text);
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

/* ===== Instruction Specifics ===== */
.instruction-step {
  margin-bottom: 24px;
  padding: 16px;
  background: var(--bg-softer);
  border-radius: var(--radius);
  border-left: 3px solid var(--accent);
}

.instruction-step h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}

.instruction-step ul {
  padding-left: 20px;
  margin: 0;
}

.instruction-step li {
  margin-bottom: 6px;
  color: var(--text-soft);
  font-size: 13px;
  line-height: 1.5;
}

/* ===== Results & Tables ===== */
.results-container { margin-top: 24px; }

.result-card, .comparison-result {
  background: var(--bg-soft);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
  max-height: 400px;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

th {
  background: var(--bg-softer);
  font-weight: 600;
  color: var(--text-mute);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

tr:hover td { background: var(--accent-soft); }

/* ===== Action Buttons ===== */
.action-buttons {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.nav-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 16px;
}

/* ===== Spring & Snow Effects ===== */
.snow-container, .spring-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9997;
  overflow: hidden;
}

.snowflake {
  position: absolute;
  background: var(--text-mute);
  border-radius: 50%;
  opacity: 0.4;
  animation: fall linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-10px); opacity: 0; }
  10% { opacity: 0.4; }
  90% { opacity: 0.4; }
  100% { transform: translateY(100vh); opacity: 0; }
}

.sakura-petal {
  position: absolute;
  border-radius: 50% 0 50% 50%;
  opacity: 0.5;
  animation: sakuraFall linear infinite;
}

@keyframes sakuraFall {
  0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
  10% { opacity: 0.5; }
  90% { opacity: 0.5; }
  100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

.spring-sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--warning);
  border-radius: 50%;
  animation: sparkleTwinkle 2s ease-in-out infinite;
}

@keyframes sparkleTwinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.5); }
}

/* ===== Utility ===== */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.gap-2 { gap: 8px; }
.mb-4 { margin-bottom: 16px; }
.mb-6 { margin-bottom: 24px; }
.hidden { display: none; }

@media (max-width: 992px) {
  .app-container {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
  }
  .sidebar {
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .control-panel {
    bottom: 24px;
    top: auto;
    right: 24px;
    transform: none;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
}

@media (max-width: 640px) {
  .header { padding: 16px 20px; }
  .main-content { padding: 20px; }
  .card { padding: 16px; }
  .action-buttons { flex-direction: column; }
  .btn { width: 100%; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
</style>
</head>
<body>
<div class="app-container">
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
      <div>
        <div class="logo-text">Анализ данных</div>
        <div style="font-size: 12px; color: var(--text-mute);">Визуализация CSV в реальном времени</div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3 class="section-title"><i class="fas fa-database"></i><span>Данные</span></h3>
      <div class="file-upload" id="fileUploadZone">
        <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
        <div class="upload-text">Перетащите CSV файлы</div>
        <div class="upload-subtext">или нажмите для выбора</div>
        <input type="file" id="csvFileInput" class="file-input" accept=".csv" multiple style="display: none;">
      </div>
      
      <div class="form-group mb-4" style="margin-top: 20px;">
        <label class="form-label"><i class="fas fa-layer-group"></i><span>Сайт</span></label>
        <div class="select-wrapper">
          <select id="blockSelect"><option value="" disabled selected>Выберите сайт</option></select>
        </div>
      </div>
      
      <div class="form-group mb-4">
        <label class="form-label"><i class="fas fa-tools"></i><span>Инструмент</span></label>
        <div class="select-wrapper">
          <select id="toolSelect"><option value="" disabled selected>Выберите инструмент</option></select>
        </div>
      </div>
      
      <div class="form-group mb-4">
        <label class="form-label"><i class="fas fa-sliders-h"></i><span>Режим</span></label>
        <div class="select-wrapper">
          <select id="modeSelect">
            <option value="all">Общий</option>
            <option value="individual">По сотруднику</option>
          </select>
        </div>
      </div>
      
      <div class="form-group mb-4" id="employeeSection" style="display: none;">
        <label class="form-label"><i class="fas fa-user"></i><span>Сотрудник</span></label>
        <div class="select-wrapper">
          <select id="employeeSelect"><option value="" disabled selected>Выберите сотрудника</option></select>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <h3 class="section-title"><i class="fas fa-history"></i><span>Файлы</span></h3>
      <div class="file-list" id="fileList"></div>
    </div>

    <div class="sidebar-section">
      <h3 class="section-title"><i class="fas fa-bolt"></i><span>Действия</span></h3>
      <button class="btn btn-secondary" style="width: 100%; display: none;" id="exportSOTBtn">
        <i class="fas fa-download"></i><span>Выгрузить СОТ</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-header">
      <h1 class="page-title">Панель управления</h1>
      <p class="page-subtitle">Загрузите данные и настройте параметры для построения графика</p>
    </div>

    <div class="card mb-6">
      <div class="card-header">
        <h2 class="card-title"><i class="fas fa-chart-line"></i><span id="chartTitle">Загрузите данные</span></h2>
        <div class="flex gap-2">
          <button class="btn btn-icon btn-secondary" id="zoomInBtn" title="Приблизить"><i class="fas fa-search-plus"></i></button>
          <button class="btn btn-icon btn-secondary" id="zoomOutBtn" title="Отдалить"><i class="fas fa-search-minus"></i></button>
          <button class="btn btn-icon btn-secondary" id="resetZoomBtn" title="Сбросить"><i class="fas fa-expand-arrows-alt"></i></button>
        </div>
      </div>
      <div class="chart-container">
        <div class="chart-wrapper"><canvas id="myChart"></canvas></div>
      </div>
      <div class="chart-legend" id="chartLegend" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; padding: 12px; background: var(--bg-softer); border-radius: var(--radius-sm); border: 1px solid var(--border);"></div>
      
      <div class="nav-buttons" id="graphNavButtons" style="display: none;">
        <button class="btn btn-secondary" id="prevGraph"><i class="fas fa-chevron-left"></i> Предыдущий</button>
        <button class="btn btn-secondary" id="nextGraph"><i class="fas fa-chevron-right"></i> Следующий</button>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-rotate"></i> Обновить</button>
      <button class="btn btn-primary" id="topBtn"><i class="fas fa-star"></i> ТОП</button>
      <button class="btn btn-primary" id="summaryBtn"><i class="fas fa-chart-pie"></i> Итоги</button>
    </div>

    <div class="results-container">

<!-- Effects Containers -->
<div class="snow-container" id="snowContainer"></div>
<div class="spring-container" id="springContainer"></div>

<script>
// ===== Глобальные переменные =====
let dataBlocks = { SOT: { labels: [], data: {} }, PMK: { labels: [], data: {} }, TORUDA: { labels: [], data: {} } };
let currentBlock = null;
let currentTool = null;
let currentEmployee = null;
let chartInstance = null;
let csvFilesData = [];
let currentCsvIndex = -1;
let fileNames = [];
let snowActive = false;
let darkMode = false;
let savedToolSelection = '';
let fileChosen = false;

// ===== Инициализация =====
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initEventListeners();
  loadInstruction();
  
  const savedCsv = localStorage.getItem('csvData');
  if (savedCsv) {
    processCSV(savedCsv);
    showToast('Данные восстановлены', 'info');
  }
  
  updateSnowButtonVisibility();
  updateSpringButtonVisibility();
  if (isSnowPeriod()) toggleSnow();
});

// ===== Тема =====
function initTheme() {
  const savedTheme = localStorage.getItem('theme') || 'light';
  darkMode = savedTheme === 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  const themeBtn = document.getElementById('themeToggleBtn');
  themeBtn.innerHTML = darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}

// ===== Обработчики событий =====
function initEventListeners() {
  const fileInput = document.getElementById('csvFileInput');
  const uploadZone = document.getElementById('fileUploadZone');
  
  uploadZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', handleFileSelect);
  
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('drag-over'); });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      handleFileSelect();
    }
  });

  document.getElementById('modeSelect').addEventListener('change', toggleEmployeeSection);
  document.getElementById('blockSelect').addEventListener('change', handleBlockChange);
  document.getElementById('toolSelect').addEventListener('change', handleToolChange);
  document.getElementById('employeeSelect').addEventListener('change', handleEmployeeChange);

  document.getElementById('refreshBtn').addEventListener('click', updateChart);
  document.getElementById('topBtn').addEventListener('click', showTopEmployees);
  document.getElementById('summaryBtn').addEventListener('click', showSummary);
  document.getElementById('exportSOTBtn').addEventListener('click', () => document.getElementById('sotModal').classList.add('show'));

  document.getElementById('prevGraph').addEventListener('click', showPrevGraph);
  document.getElementById('nextGraph').addEventListener('click', showNextGraph);

  document.getElementById('zoomInBtn').addEventListener('click', () => { if (chartInstance) chartInstance.zoom(1.1); });
  document.getElementById('zoomOutBtn').addEventListener('click', () => { if (chartInstance) chartInstance.zoom(0.9); });
  document.getElementById('resetZoomBtn').addEventListener('click', () => { if (chartInstance) chartInstance.resetZoom(); });

  document.getElementById('instructionToggle').addEventListener('click', () => document.getElementById('instructionModal').classList.add('show'));
  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
  document.getElementById('snowToggleBtn').addEventListener('click', toggleSnow);
  document.getElementById('springToggleBtn').addEventListener('click', toggleSpringTheme);
  document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
  
  document.querySelectorAll('.modal-close, .modal').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal') || e.target.classList.contains('modal-close')) {
        document.querySelectorAll('.modal').forEach(modal => modal.classList.remove('show'));
      }
    });
  });
  
  initEasterEggs();
}

// ===== Переключение темы =====
function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  if (currentTheme === 'spring') {
    const savedTheme = localStorage.getItem('previousTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    darkMode = savedTheme === 'dark';
    clearSpringEffects();
  } else {
    darkMode = !darkMode;
    const theme = darkMode ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }
  const themeBtn = document.getElementById('themeToggleBtn');
  themeBtn.innerHTML = darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  updateChartTheme();
  showToast('Тема изменена', 'success');
}

// ===== Обработка файлов =====
function handleFileSelect() {
  const files = document.getElementById('csvFileInput').files;
  if (!files.length) return;
  csvFilesData = []; fileNames = []; currentCsvIndex = 0;
  
  Array.from(files).forEach((file) => {
    if (file.name.endsWith('.csv')) {
      fileNames.push(file.name);
      const reader = new FileReader();
      reader.onload = (e) => {
        csvFilesData.push(e.target.result);
        if (csvFilesData.length === fileNames.length) {
          processCSV(csvFilesData[0]);
          updateFileList();
          updateGraphNavigation();
          showToast(`Загружено ${files.length} файл(ов)`, 'success');
        }
      };
      reader.readAsText(file);
    }
  });
  if (!fileChosen) {
    document.getElementById('blockSelect').innerHTML = '<option value="" disabled selected>Выберите сайт</option>';
    document.getElementById('toolSelect').innerHTML = '<option value="" disabled selected>Выберите инструмент</option>';
  }
  fileChosen = true;
}

function updateFileList() {
  const fileList = document.getElementById('fileList');
  fileList.innerHTML = '';
  fileNames.forEach((fileName, index) => {
    const chip = document.createElement('div');
    chip.className = `file-chip ${index === currentCsvIndex ? 'active' : ''}`;
    chip.innerHTML = `<i class="fas fa-file-csv"></i><span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${fileName}</span><button class="file-chip-remove" data-index="${index}"><i class="fas fa-times"></i></button>`;
    
    chip.addEventListener('click', () => {
      if (index !== currentCsvIndex) {
        currentCsvIndex = index;
        processCSV(csvFilesData[index]);
        updateFileList();
        showToast(`Переключено на: ${fileName}`, 'info');
      }
    });
    
    chip.querySelector('.file-chip-remove').addEventListener('click', (e) => {
      e.stopPropagation();
      removeFile(index);
    });
    fileList.appendChild(chip);
  });
}

function updateGraphNavigation() {
  document.getElementById('graphNavButtons').style.display = csvFilesData.length > 1 ? 'flex' : 'none';
}

function showPrevGraph() {
  if (csvFilesData.length <= 1) return;
  currentCsvIndex = (currentCsvIndex - 1 + csvFilesData.length) % csvFilesData.length;
  processCSV(csvFilesData[currentCsvIndex]);
  updateFileList();
}

function showNextGraph() {
  if (csvFilesData.length <= 1) return;
  currentCsvIndex = (currentCsvIndex + 1) % csvFilesData.length;
  processCSV(csvFilesData[currentCsvIndex]);
  updateFileList();
}

function removeFile(index) {
  csvFilesData.splice(index, 1);
  fileNames.splice(index, 1);
  if (csvFilesData.length === 0) {
    currentCsvIndex = -1;
    resetUI();
  } else {
    currentCsvIndex = Math.min(currentCsvIndex, csvFilesData.length - 1);
    processCSV(csvFilesData[currentCsvIndex]);
  }
  updateFileList();
  updateGraphNavigation();
}

// ===== Обработка CSV =====
function processCSV(text) {
  dataBlocks = { SOT: { labels: [], data: {} }, PMK: { labels: [], data: {} }, TORUDA: { labels: [], data: {} } };
  const lines = text.trim().split(/\r?\n/);
  const pmkIdx = lines.findIndex(l => l.includes("PMK"));
  const torIdx = lines.findIndex(l => l.includes("TORUDA"));
  
  const SOTLines = lines.slice(0, pmkIdx);
  const PMKLines = lines.slice(pmkIdx, torIdx);
  const TORUDALines = lines.slice(torIdx);

  ['SOT', 'PMK', 'TORUDA'].forEach(block => {
    let blockLines = block === 'SOT' ? SOTLines : block === 'PMK' ? PMKLines : TORUDALines;
    const parsedData = {};
    const dateSet = new Set();
    
    for (const line of blockLines) {
      const cols = line.split(';').map(c => c.trim());
      if (cols.length < 7) continue;
      const [person, tool, , , , , dateStr] = cols;
      const dateLabel = parseDate(dateStr);
      if (!dateLabel) continue;
      dateSet.add(dateLabel);
      
      const values = [];
      for (let i = 2; i <= 5; i++) values.push(parseFloat(cols[i].replace(',', '.')) || 0);
      const total = values.reduce((a, b) => a + b, 0);
      
      if (!parsedData[tool]) parsedData[tool] = {};
      if (!parsedData[tool][person]) parsedData[tool][person] = {};
      if (!parsedData[tool][person][dateLabel]) parsedData[tool][person][dateLabel] = 0;
      parsedData[tool][person][dateLabel] += total;
    }
    
    const labelsArr = Array.from(dateSet).sort((a, b) => new Date(a) - new Date(b));
    const dataPerTool = {};
    for (const t in parsedData) {
      dataPerTool[t] = {};
      for (const p in parsedData[t]) {
        dataPerTool[t][p] = Array(labelsArr.length).fill(0);
        labelsArr.forEach((d, i) => { if (parsedData[t][p][d] !== undefined) dataPerTool[t][p][i] = parsedData[t][p][d]; });
      }
    }
    dataBlocks[block].labels = labelsArr;
    dataBlocks[block].data = dataPerTool;
  });
  
  updateBlockSelect();
  updateUI();
  showToast('Данные загружены', 'success');
}

function parseDate(str) {
  const parts = str.trim().split('.');
  if (parts.length !== 3) return null;
  let [d, m, y] = parts;
  if (y.length === 2) y = '20' + y;
  return `${y.padStart(4,'0')}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}

// ===== UI Обновления =====
function updateBlockSelect() {
  const blockSelect = document.getElementById('blockSelect');
  blockSelect.innerHTML = '<option value="" disabled selected>Выберите сайт</option>';
  Object.keys(dataBlocks).forEach(block => {
    const option = document.createElement('option');
    option.value = block;
    option.textContent = block;
    blockSelect.appendChild(option);
  });
  if (Object.keys(dataBlocks).length > 0) {
    blockSelect.value = Object.keys(dataBlocks)[0];
    handleBlockChange();
  }
}

function handleBlockChange() {
  currentBlock = document.getElementById('blockSelect').value;
  const blockData = dataBlocks[currentBlock];
  const toolSelect = document.getElementById('toolSelect');
  const selectEmp = document.getElementById('employeeSelect');
  
  toolSelect.innerHTML = '<option value="" disabled selected>Выберите инструмент</option>';
  selectEmp.innerHTML = '';
  
  const tools = Object.keys(blockData.data);
  tools.forEach(tool => {
    const option = document.createElement('option');
    option.value = tool;
    option.textContent = tool;
    if (tool === savedToolSelection) option.selected = true;
    toolSelect.appendChild(option);
  });
  
  const employees = new Set();
  tools.forEach(t => Object.keys(blockData.data[t] || {}).forEach(e => employees.add(e)));
  const empArr = Array.from(employees).sort();
  empArr.forEach(e => {
    const option = document.createElement('option');
    option.value = e;
    option.textContent = e;
    selectEmp.appendChild(option);
  });
  
  if (tools.length > 0) {
    currentTool = (savedToolSelection && tools.includes(savedToolSelection)) ? savedToolSelection : tools[0];
    toolSelect.value = currentTool;
    if (empArr.length > 0) {
      currentEmployee = empArr[0];
      selectEmp.value = currentEmployee;
    }
    updateChart();
    document.getElementById('chartTitle').textContent = `${currentBlock} | ${currentTool}`;
  } else {
    if (chartInstance) chartInstance.destroy();
  }
}

function handleToolChange() {
  currentTool = document.getElementById('toolSelect').value;
  savedToolSelection = currentTool;
  updateChart();
}

function handleEmployeeChange() {
  currentEmployee = document.getElementById('employeeSelect').value;
  updateChart();
}

function toggleEmployeeSection() {
  document.getElementById('employeeSection').style.display = document.getElementById('modeSelect').value === 'individual' ? 'block' : 'none';
  updateChart();
}

function updateUI() {
  document.getElementById('chartTitle').textContent = currentBlock && currentTool ? `${currentBlock} | ${currentTool}` : 'Загрузите данные';
}

// ===== График =====
function updateChart() {
  const ctx = document.getElementById('myChart').getContext('2d');
  const mode = document.getElementById('modeSelect').value;
  const blockData = dataBlocks[currentBlock];
  
  document.getElementById('chartTitle').textContent = `${currentBlock} | ${currentTool}`;
  if (!blockData || !currentTool) return;
  
  const labels = blockData.labels;
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  
  let datasets = [];
  if (mode === 'all') {
    const persons = Object.keys(blockData.data[currentTool] || {});
    datasets = persons.map((person, index) => ({
      label: person,
      data: blockData.data[currentTool][person],
      borderColor: getColor(index),
      backgroundColor: getColor(index, 0.1),
      borderWidth: 2,
      tension: 0.4,
      fill: true,
      pointRadius: 3,
      pointHoverRadius: 5
    }));
  } else {
    if (currentEmployee && blockData.data[currentTool][currentEmployee]) {
      datasets = [{
        label: currentEmployee,
        data: blockData.data[currentTool][currentEmployee],
        borderColor: getColor(0),
        backgroundColor: getColor(0, 0.1),
        borderWidth: 2,
        tension: 0.4,
        fill: true,
        pointRadius: 4,
        pointHoverRadius: 6
      }];
    }
  }
  
  if (chartInstance) {
    chartInstance.data.labels = labels;
    chartInstance.data.datasets = datasets;
    chartInstance.options.plugins.title.text = document.getElementById('chartTitle').textContent || 'График';
    chartInstance.options.plugins.title.color = textColor;
    chartInstance.options.plugins.legend.labels.color = textColor;
    chartInstance.options.scales.x.ticks.color = textColor;
    chartInstance.options.scales.y.ticks.color = textColor;
    chartInstance.options.scales.x.grid.color = gridColor;
    chartInstance.options.scales.y.grid.color = gridColor;
    chartInstance.update();
  } else {
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 800, easing: 'easeOutQuart' },
        plugins: {
          legend: { position: 'top', labels: { color: textColor, font: { size: 11 }, usePointStyle: true, pointStyle: 'circle' } },
          title: { display: true, text: document.getElementById('chartTitle').textContent || 'График', color: textColor, font: { size: 14, weight: '600' } },
          zoom: { pan: { enabled: true, mode: 'xy' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'xy' } }
        },
        scales: {
          x: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor, drawBorder: false }, title: { display: true, text: 'Дата', color: textColor, font: { size: 12, weight: '500' } } },
          y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor, drawBorder: false }, title: { display: true, text: 'Значение', color: textColor, font: { size: 12, weight: '500' } } }
        }
      }
    });
  }
  updateChartLegend(datasets);
}

function updateChartTheme() {
  if (!chartInstance) return;
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  chartInstance.options.scales.x.ticks.color = textColor;
  chartInstance.options.scales.y.ticks.color = textColor;
  chartInstance.options.scales.x.grid.color = gridColor;
  chartInstance.options.scales.y.grid.color = gridColor;
  chartInstance.options.plugins.title.color = textColor;
  chartInstance.options.plugins.legend.labels.color = textColor;
  chartInstance.update();
}

function updateChartLegend(datasets) {
  const legend = document.getElementById('chartLegend');
  legend.innerHTML = '';
  datasets.forEach(dataset => {
    const item = document.createElement('div');
    item.style.display = 'flex';
    item.style.alignItems = 'center';
    item.style.gap = '6px';
    item.style.fontSize = '12px';
    item.style.color = 'var(--text-soft)';
    item.innerHTML = `<div style="width: 10px; height: 10px; border-radius: 50%; background-color: ${dataset.borderColor};"></div><span>${dataset.label}</span>`;
    legend.appendChild(item);
  });
}

function getColor(index, alpha = 1) {
  const colors = [
    `rgba(26, 26, 26, ${alpha})`,
    `rgba(102, 126, 234, ${alpha})`,
    `rgba(16, 185, 129, ${alpha})`,
    `rgba(245, 158, 11, ${alpha})`,
    `rgba(220, 38, 38, ${alpha})`,
    `rgba(139, 92, 246, ${alpha})`
  ];
  return colors[index % colors.length];
}

// ===== ТОП сотрудников =====
function showTopEmployees() {
  if (!dataBlocks[currentBlock]) return;
  const blockData = dataBlocks[currentBlock];
  const tool = document.getElementById('toolSelect').value;
  const sums = {};
  for (const emp in blockData.data[tool]) sums[emp] = blockData.data[tool][emp].reduce((a, b) => a + b, 0);
  const sorted = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const top3 = sorted.slice(0, 3);
  
  let html = `<h3 style="font-family: var(--font-display); font-size: 16px; margin-bottom: 16px;">🏆 ТОП по инструменту: ${tool}</h3><div style="display: flex; flex-direction: column; gap: 8px;">`;
  const icons = ['🥇', '🥈', '🥉'];
  top3.forEach((item, i) => {
    html += `<div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-softer); border-radius: var(--radius-sm); border: 1px solid var(--border);">
      <span style="font-size: 20px;">${icons[i]}</span>
      <div style="flex: 1;"><div style="font-weight: 600; font-size: 14px;">${item[0]}</div><div style="color: var(--text-mute); font-size: 12px; font-family: var(--font-mono);">${item[1].toFixed(2)}</div></div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('averageResult').innerHTML = html;
}

// ===== Итоги =====
function showSummary() {
  const block = currentBlock;
  const tool = document.getElementById('toolSelect').value;
  const blockData = dataBlocks[block];
  if (!blockData || !blockData.labels || !blockData.data || !blockData.data[tool]) {
    showToast('Нет данных для расчёта итогов', 'error');
    return;
  }
  const employeesData = blockData.data[tool];
  let html = '<h3 style="font-family: var(--font-display); font-size: 16px; margin-bottom: 16px;">📊 Итоги за период</h3><div class="table-container"><table><thead><tr><th>Сотрудник</th><th style="text-align: right;">Сумма</th></tr></thead><tbody>';
  
  let summaries = [];
  for (const emp in employeesData) {
    let totalSum = employeesData[emp].reduce((a, b) => a + b, 0);
    summaries.push({ name: emp, sum: totalSum });
  }
  summaries.sort((a, b) => b.sum - a.sum);
  
  summaries.forEach(item => {
    html += `<tr><td style="font-weight: 500;">${item.name}</td><td style="text-align: right; font-family: var(--font-mono); font-weight: 600;">${item.sum.toFixed(2)}</td></tr>`;
  });
  html += '</tbody></table></div>';
  document.getElementById('averageResult').innerHTML = html;
}

// ===== Уведомления =====
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  toast.innerHTML = `<div style="font-size: 16px;">${icon}</div><div style="flex: 1;">${message}</div><button class="modal-close" style="width: 24px; height: 24px; font-size: 18px;">&times;</button>`;
  
  toast.querySelector('.modal-close').addEventListener('click', () => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    setTimeout(() => toast.remove(), 300);
  });
  
  container.appendChild(toast);
  setTimeout(() => {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(20px)';
      setTimeout(() => toast.remove(), 300);
    }
  }, 4000);
}

// ===== Снегопад =====
function toggleSnow() {
  const snowContainer = document.getElementById('snowContainer');
  const snowBtn = document.getElementById('snowToggleBtn');
  if (snowActive) {
    snowContainer.innerHTML = '';
    snowBtn.classList.remove('active');
    showToast('Снегопад остановлен', 'info');
  } else {
    createSnowflakes();
    snowBtn.classList.add('active');
    showToast('Снегопад запущен', 'info');
  }
  snowActive = !snowActive;
}

function createSnowflakes() {
  const snowContainer = document.getElementById('snowContainer');
  snowContainer.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const snowflake = document.createElement('div');
    snowflake.className = 'snowflake';
    const size = Math.random() * 4 + 2;
    snowflake.style.width = `${size}px`;
    snowflake.style.height = `${size}px`;
    snowflake.style.left = `${Math.random() * 100}%`;
    snowflake.style.animationDuration = `${Math.random() * 5 + 5}s`;
    snowflake.style.animationDelay = `${Math.random() * 5}s`;
    snowContainer.appendChild(snowflake);
  }
}

function isSnowPeriod() {
  const now = new Date();
  const month = now.getMonth();
  return month === 11 || month === 0 || month === 1; // Дек, Янв, Фев
}

// ===== Полный экран =====
function toggleFullscreen() {
  const elem = document.documentElement;
  const btn = document.getElementById('fullscreenBtn');
  if (!document.fullscreenElement) {
    elem.requestFullscreen().catch(err => showToast(`Ошибка: ${err.message}`, 'error'));
    btn.innerHTML = '<i class="fas fa-compress"></i>';
  } else {
    document.exitFullscreen();
    btn.innerHTML = '<i class="fas fa-expand"></i>';
  }
}

// ===== Easter Eggs =====
function initEasterEggs() {
  let clicks = 0;
  let timer = null;
  document.addEventListener('click', (e) => {
    if (e.target.closest('.header')) {
      clicks++;
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => { clicks = 0; }, 500);
      if (clicks >= 3) {
        clicks = 0;
        showToast('🎉 Пасхалка!', 'success');
        startConfetti();
      }
    }
  });
  
  window.addEventListener('keydown', (e) => {
    if (e.key === 'p') {
      showToast('🐧 Пингвин активирован!', 'success');
      const penguin = document.createElement('div');
      penguin.style.cssText = 'position: fixed; bottom: 20px; right: 20px; font-size: 3rem; z-index: 10000; pointer-events: none;';
      penguin.textContent = '🐧';
      document.body.appendChild(penguin);
      penguin.animate([{ transform: 'translateX(0) rotate(0deg)' }, { transform: 'translateX(-100px) rotate(360deg)' }, { transform: 'translateX(0) rotate(720deg)' }], { duration: 2000 }).onfinish = () => setTimeout(() => penguin.remove(), 1000);
    }
  });
}

function startConfetti() {
  for (let i = 0; i < 100; i++) {
    const confetti = document.createElement('div');
    confetti.style.cssText = `position: fixed; top: ${Math.random() * window.innerHeight}px; left: ${Math.random() * window.innerWidth}px; width: 6px; height: 6px; background: hsl(${Math.random()*360}, 70%, 60%); border-radius: 50%; z-index: 9999; pointer-events: none;`;
    document.body.appendChild(confetti);
    confetti.animate([{ transform: `translateY(0) rotate(0deg)`, opacity: 1 }, { transform: `translateY(${window.innerHeight + 10}px) rotate(${Math.random()*360}deg)`, opacity: 0 }], { duration: 3000 + Math.random()*2000 }).onfinish = () => confetti.remove();
  }
}

// ===== Утилиты =====
function resetUI() {
  document.getElementById('chartTitle').textContent = 'Загрузите данные';
  document.getElementById('averageResult').innerHTML = '';
  document.getElementById('comparisonResult').style.display = 'none';
  document.getElementById('chartLegend').innerHTML = '';
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

function updateSnowButtonVisibility() {
  const snowBtn = document.getElementById('snowToggleBtn');
  if (isSnowPeriod()) {
    snowBtn.classList.remove('snow-hidden');
  } else {
    snowBtn.classList.add('snow-hidden');
    if (snowActive) toggleSnow();
  }
}

function toggleSpringTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const springBtn = document.getElementById('springToggleBtn');
  
  if (!isSpringPeriod()) {
    showToast('Весенняя тема доступна только с 1 марта по 31 мая 🌸', 'warning');
    return;
  }
  
  if (currentTheme === 'spring') {
    const savedTheme = localStorage.getItem('previousTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    springBtn.classList.remove('active');
    clearSpringEffects();
    showToast('Весенняя тема отключена', 'info');
    darkMode = savedTheme === 'dark';
    document.getElementById('themeToggleBtn').innerHTML = darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  } else {
    localStorage.setItem('previousTheme', currentTheme);
    document.documentElement.setAttribute('data-theme', 'spring');
    springBtn.classList.add('active');
    showToast('Весенняя тема включена! 🌸', 'success');
    createSpringEffects();
    document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i>';
  }
  updateChartTheme();
}

function createSpringEffects() {
  let container = document.getElementById('springContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'springContainer';
    container.className = 'spring-container';
    document.body.appendChild(container);
  }
  container.innerHTML = '';
  
  for (let i = 0; i < 15; i++) {
    const petal = document.createElement('div');
    petal.className = 'sakura-petal';
    const size = Math.random() * 15 + 8;
    petal.style.width = `${size}px`;
    petal.style.height = `${size}px`;
    petal.style.left = `${Math.random() * 100}%`;
    petal.style.top = `-50px`;
    petal.style.animationDuration = `${Math.random() * 10 + 8}s`;
    petal.style.animationDelay = `${Math.random() * 5}s`;
    petal.style.background = 'var(--warning)';
    petal.style.opacity = '0.4';
    container.appendChild(petal);
    
    setTimeout(() => { if (petal.parentNode && document.documentElement.getAttribute('data-theme') === 'spring') { petal.remove(); createSpringEffects(); } }, 15000);
  }
  
  for (let i = 0; i < 8; i++) {
    const sparkle = document.createElement('div');
    sparkle.className = 'spring-sparkle';
    sparkle.style.left = `${Math.random() * 100}%`;
    sparkle.style.top = `${Math.random() * 100}%`;
    sparkle.style.animationDelay = `${Math.random() * 2}s`;
    container.appendChild(sparkle);
  }
}

function clearSpringEffects() {
  const container = document.getElementById('springContainer');
  if (container) container.remove();
}

function isSpringPeriod() {
  const now = new Date();
  const month = now.getMonth();
  return month === 2 || month === 3 || month === 4; // Март, Апрель, Май
}

function updateSpringButtonVisibility() {
  const springBtn = document.getElementById('springToggleBtn');
  if (isSpringPeriod()) {
    springBtn.style.display = 'flex';
  } else {
    springBtn.style.display = 'none';
    if (document.documentElement.getAttribute('data-theme') === 'spring') {
      const savedTheme = localStorage.getItem('previousTheme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      clearSpringEffects();
    }
  }
}
