<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обработчик чисел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --bg-soft: #ffffff;
    --bg-softer: #f5f5f0;
    --border: #e5e5e0;
    --border-strong: #d4d4cf;
    --text: #1a1a1a;
    --text-soft: #666666;
    --text-mute: #999999;
    --accent: #1a1a1a;
    --accent-soft: #f0f0ec;
    --success: #10b981;
    --danger: #dc2626;
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
  }

  [data-theme="dark"] {
    --bg: #0f0f0f;
    --bg-soft: #1a1a1a;
    --bg-softer: #141414;
    --border: #262626;
    --border-strong: #333333;
    --text: #f5f5f0;
    --text-soft: #a0a0a0;
    --text-mute: #666666;
    --accent: #f5f5f0;
    --accent-soft: #1f1f1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
  }

  .container {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: var(--radius-lg);
    max-width: 900px;
    width: 100%;
    animation: floatIn 0.4s ease-out;
    position: relative;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }

  h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.5;
  }

  .theme-toggle {
    background: transparent;
    border: 1px solid var(--border);
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    width: 36px;
    height: 36px;
    color: var(--text-soft);
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    background: var(--accent-soft);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .sun-icon { display: block; }
  .moon-icon { display: none; }
  [data-theme="dark"] .sun-icon { display: none; }
  [data-theme="dark"] .moon-icon { display: block; }

  .input-section {
    background: var(--bg-softer);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: var(--radius);
    margin-bottom: 24px;
  }

  label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-mute);
    font-weight: 600;
  }

  .premium-badge {
    background: var(--accent-soft);
    color: var(--text-soft);
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  textarea {
    width: 100%;
    height: 180px;
    padding: 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-soft);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    resize: vertical;
    transition: border-color 0.2s;
    line-height: 1.6;
    color: var(--text);
    outline: none;
  }

  textarea:focus {
    border-color: var(--text);
  }

  textarea::placeholder {
    color: var(--text-mute);
  }

  .quick-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .quick-btn {
    padding: 8px 16px;
    font-size: 13px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-soft);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    font-family: inherit;
  }

  .quick-btn:hover {
    background: var(--accent-soft);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .buttons-row {
    display: flex;
    gap: 10px;
    margin: 24px 0;
    flex-wrap: wrap;
  }

  .btn {
    padding: 12px 24px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex: 1;
    font-family: inherit;
    background: var(--bg-soft);
    color: var(--text);
  }

  .btn:hover {
    background: var(--accent-soft);
    border-color: var(--border-strong);
  }

  .btn-primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .btn-primary:hover {
    opacity: 0.85;
    background: var(--text);
    color: var(--bg);
  }

  .separator-panel {
    background: var(--bg-softer);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    display: none;
  }

  .separator-panel.show {
    display: block;
    animation: slideDown 0.3s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .separator-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-mute);
    font-weight: 600;
    margin-bottom: 16px;
  }

  .separator-input-glass {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .separator-input-glass input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--bg-soft);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  .separator-input-glass input:focus {
    border-color: var(--text);
  }

  .presets-modern {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .preset-chip {
    padding: 6px 12px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
    color: var(--text-soft);
    font-family: 'JetBrains Mono', monospace;
  }

  .preset-chip:hover {
    background: var(--accent-soft);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .result-section {
    background: var(--bg-softer);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: var(--radius);
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .result-header span:first-child {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-mute);
    font-weight: 600;
  }

  .stats-modern {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .result-display {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: var(--radius-sm);
    min-height: 120px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .result-display:hover {
    border-color: var(--border-strong);
  }

  .history-panel-modern {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .history-header span {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-mute);
    font-weight: 600;
  }

  .history-item-modern {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }

  .history-item-modern:hover {
    border-color: var(--border-strong);
    background: var(--accent-soft);
  }

  .history-time {
    color: var(--text-mute);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    min-width: 60px;
  }

  .history-preview {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    font-size: 13px;
    flex: 1;
    margin: 0 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-badge {
    background: var(--accent-soft);
    color: var(--text-soft);
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .footer-modern {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: var(--text-mute);
  }

  .shortcut {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-soft);
  }

  .glow-text {
    color: var(--text);
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s;
  }

  .glow-text:hover {
    color: var(--text-soft);
  }

  /* Уведомления */
  .notification {
    position: fixed;
    top: 24px;
    right: 24px;
    padding: 14px 20px;
    border-radius: var(--radius-sm);
    font-weight: 500;
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    animation: slideIn 0.3s ease;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }

  .notification.success {
    background: var(--bg-soft);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.2);
  }

  .notification.error {
    background: var(--bg-soft);
    color: var(--danger);
    border: 1px solid rgba(220, 38, 38, 0.2);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 640px) {
    .container { padding: 24px; }
    h2 { font-size: 20px; }
    .buttons-row { flex-direction: column; }
    .separator-input-glass { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <div>
      <h2>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        Обработчик чисел
      </h2>
      <p class="subtitle">Быстрая очистка, форматирование и удаление дубликатов</p>
    </div>
    <button type="button" id="themeToggle" class="theme-toggle" title="Переключить тему">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>

  <div class="input-section">
    <label>
      <span>Входные данные</span>
      <span class="premium-badge">Любые разделители</span>
    </label>
    <textarea id="inputArea" placeholder="Вставьте числа в любом формате...
123 456 789
321, 654, 987
1000 2000 3000"></textarea>
    
    <div class="quick-actions">
      <button class="quick-btn" onclick="insertExample()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Пример
      </button>
      <button class="quick-btn" onclick="removeDuplicates()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Убрать дубли
      </button>
      <button class="quick-btn" onclick="sortNumbers()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        Сортировать
      </button>
    </div>
  </div>

  <div class="buttons-row">
    <button class="btn btn-primary" onclick="addCommas()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Только запятые
    </button>
    <button class="btn btn-primary" onclick="addCommasAndSpace()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Запятые + пробел
    </button>
    <button class="btn" onclick="toggleSeparatorPanel()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Свой формат
    </button>
  </div>

  <div class="separator-panel" id="separatorPanel">
    <div class="separator-title">Настройка разделителя</div>
    <div class="separator-input-glass">
      <input type="text" id="customSeparator" placeholder="Введите разделитель..." value=", ">
      <button class="btn btn-primary" onclick="addCustomSeparator()" style="flex: 0 0 auto;">Применить</button>
    </div>
    <div class="presets-modern">
      <span class="preset-chip" onclick="setSeparator(',')">, запятая</span>
      <span class="preset-chip" onclick="setSeparator(', ')">, + пробел</span>
      <span class="preset-chip" onclick="setSeparator(';')">; точка с запятой</span>
      <span class="preset-chip" onclick="setSeparator(' | ')"> | черта</span>
      <span class="preset-chip" onclick="setSeparator('\n')">\n строка</span>
    </div>
  </div>

  <div class="buttons-row">
    <button class="btn" onclick="copyResult()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Копировать
    </button>
    <button class="btn" onclick="clearAll()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Очистить
    </button>
    <button class="btn" onclick="swapInputOutput()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      В обратную сторону
    </button>
  </div>

  <div class="result-section">
    <div class="result-header">
      <span>Результат обработки</span>
      <span id="stats" class="stats-modern">
        <span>Всего: <strong id="countStat">0</strong></span>
      </span>
    </div>
    <div id="result" class="result-display" onclick="selectResult()"></div>
    
    <div class="history-panel-modern" id="historyPanel" style="display: none;">
      <div class="history-header">
        <span>История операций</span>
        <button class="quick-btn" onclick="clearHistory()" style="padding: 4px 10px; font-size: 11px;">Очистить</button>
      </div>
      <div id="historyList"></div>
    </div>

    <div class="footer-modern">
      <div>
        <span class="shortcut">Ctrl + Enter</span> обработать
        <span class="shortcut" style="margin-left: 8px;">Esc</span> очистить
      </div>
      <div>
        <span class="glow-text" onclick="toggleHistory()">📜 История</span>
      </div>
    </div>
  </div>
</div>

<script>
  // Тема
  function initTheme() {
    var saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  }
  initTheme();

  document.getElementById('themeToggle').addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    var newTheme = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  });

  let lastResult = '';
  let history = JSON.parse(localStorage.getItem('numberProcessorHistory')) || [];
  let lastUsedSeparator = ', ';

  function showNotification(message, isError = false) {
    const notification = document.createElement('div');
    notification.className = `notification ${isError ? 'error' : 'success'}`;
    
    const icon = isError 
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
      
    notification.innerHTML = icon + '<span>' + message + '</span>';
    document.body.appendChild(notification);

    setTimeout(() => {
      notification.style.opacity = '0';
      notification.style.transform = 'translateX(20px)';
      setTimeout(() => notification.remove(), 300);
    }, 3000);
  }

  function extractNumbers(inputText) {
    if (!inputText.trim()) return [];
    const numbers = inputText.split(/[\s,;]+/).filter(s => s.trim() !== '');
    const nonNumeric = numbers.filter(n => isNaN(n) || n === '');
    if (nonNumeric.length > 0) {
      showNotification(`Найдено ${nonNumeric.length} нечисловых значений`, true);
    }
    return numbers;
  }

  function updateStats(numbers) {
    const statsElement = document.getElementById('stats');
    const countElement = document.getElementById('countStat');
    if (numbers && numbers.length > 0) {
      countElement.innerText = numbers.length;
    } else {
      countElement.innerText = '0';
    }
  }

  function formatResult(numbers, prefix = ',', suffix = '') {
    if (numbers.length === 0) return '';
    return numbers.map((num, index) => {
      if (index === 0) return num;
      return prefix + num + suffix;
    }).join('');
  }

  function addToHistory(result, operation) {
    const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const preview = result.length > 40 ? result.substring(0, 40) + '...' : result;
    
    history.unshift({ timestamp, result, preview, operation });
    if (history.length > 10) history.pop();
    localStorage.setItem('numberProcessorHistory', JSON.stringify(history));
    updateHistoryDisplay();
  }

  function updateHistoryDisplay() {
    const historyList = document.getElementById('historyList');
    if (history.length === 0) {
      historyList.innerHTML = '<div style="color: var(--text-mute); text-align: center; padding: 20px; font-size: 13px; font-style: italic;">История пока пуста</div>';
      return;
    }

    historyList.innerHTML = history.map((item, index) => `
      <div class="history-item-modern" onclick="restoreFromHistory(${index})">
        <span class="history-time">${item.timestamp}</span>
        <span class="history-preview">${item.preview}</span>
        <span class="history-badge">${item.operation || 'обработка'}</span>
      </div>
    `).join('');
  }

  function restoreFromHistory(index) {
    if (history[index]) {
      document.getElementById('result').innerText = history[index].result;
      lastResult = history[index].result;
      showNotification('Восстановлено из истории');
    }
  }

  function clearHistory() {
    history = [];
    localStorage.removeItem('numberProcessorHistory');
    updateHistoryDisplay();
    showNotification('История очищена');
  }

  function toggleHistory() {
    const panel = document.getElementById('historyPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') {
      updateHistoryDisplay();
    }
  }

  function selectResult() {
    const result = document.getElementById('result');
    const range = document.createRange();
    range.selectNodeContents(result);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }

  function toggleSeparatorPanel() {
    const panel = document.getElementById('separatorPanel');
    panel.classList.toggle('show');
  }

  function setSeparator(separator) {
    document.getElementById('customSeparator').value = separator;
    lastUsedSeparator = separator;
  }

  function processNumbers(operation) {
    const inputText = document.getElementById('inputArea').value;
    if (!inputText.trim()) {
      showNotification('Введите данные для обработки', true);
      return null;
    }
    const numbers = extractNumbers(inputText);
    updateStats(numbers);
    return numbers;
  }

  function addCommas() {
    const numbers = processNumbers();
    if (!numbers) return;
    const resultString = formatResult(numbers, ',', '');
    document.getElementById('result').innerText = resultString;
    lastResult = resultString;
    addToHistory(resultString, 'Только запятые');
    showNotification(`Обработано ${numbers.length} чисел`);
  }

  function addCommasAndSpace() {
    const numbers = processNumbers();
    if (!numbers) return;
    const resultString = formatResult(numbers, ', ', '');
    document.getElementById('result').innerText = resultString;
    lastResult = resultString;
    addToHistory(resultString, 'Запятые с пробелом');
    showNotification(`Обработано ${numbers.length} чисел`);
  }

  function addCustomSeparator() {
    const separator = document.getElementById('customSeparator').value;
    if (!separator) {
      showNotification('Введите разделитель', true);
      return;
    }
    const numbers = processNumbers();
    if (!numbers) return;
    const resultString = formatResult(numbers, separator, '');
    document.getElementById('result').innerText = resultString;
    lastResult = resultString;
    lastUsedSeparator = separator;
    addToHistory(resultString, `Разделитель: ${separator}`);
    showNotification(`Использован разделитель: ${separator}`);
  }

  function insertExample() {
    document.getElementById('inputArea').value = '123\n456\n789\n321\n654\n987';
    showNotification('Пример вставлен');
    updateStats(extractNumbers(document.getElementById('inputArea').value));
  }

  function removeDuplicates() {
    const numbers = processNumbers();
    if (!numbers) return;
    const uniqueNumbers = [...new Set(numbers)];
    document.getElementById('inputArea').value = uniqueNumbers.join('\n');
    updateStats(uniqueNumbers);
    showNotification(`Удалено дубликатов: ${numbers.length - uniqueNumbers.length}`);
  }

  function sortNumbers() {
    const numbers = processNumbers();
    if (!numbers) return;
    const sortedNumbers = numbers.sort((a, b) => {
      const numA = parseFloat(a);
      const numB = parseFloat(b);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      return a.localeCompare(b);
    });
    document.getElementById('inputArea').value = sortedNumbers.join('\n');
    updateStats(sortedNumbers);
    showNotification('Числа отсортированы');
  }

  function copyResult() {
    if (!lastResult) {
      showNotification('Нет результата для копирования', true);
      return;
    }
    navigator.clipboard.writeText(lastResult).then(() => {
      showNotification('Скопировано в буфер обмена');
    }).catch(() => {
      const textArea = document.createElement('textarea');
      textArea.value = lastResult;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showNotification('Скопировано в буфер обмена');
      } catch (err) {
        showNotification('Ошибка копирования', true);
      }
      document.body.removeChild(textArea);
    });
  }

  function clearAll() {
    document.getElementById('inputArea').value = '';
    document.getElementById('result').innerText = '';
    updateStats([]);
    lastResult = '';
    showNotification('Все поля очищены');
  }

  function swapInputOutput() {
    if (!lastResult) {
      showNotification('Нет результата для переноса', true);
      return;
    }
    document.getElementById('inputArea').value = lastResult;
    updateStats(extractNumbers(lastResult));
    showNotification('Результат перенесён в исходные данные');
  }

  document.getElementById('inputArea').addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      addCommas();
    }
    if (e.key === 'Escape') {
      clearAll();
    }
  });

  document.getElementById('inputArea').addEventListener('input', function() {
    const numbers = extractNumbers(this.value);
    updateStats(numbers);
  });

  document.getElementById('inputArea').addEventListener('dragover', (e) => {
    e.preventDefault();
    e.target.style.borderColor = 'var(--text)';
  });

  document.getElementById('inputArea').addEventListener('dragleave', (e) => {
    e.preventDefault();
    e.target.style.borderColor = 'var(--border)';
  });

  document.getElementById('inputArea').addEventListener('drop', (e) => {
    e.preventDefault();
    e.target.style.borderColor = 'var(--border)';
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      const file = files[0];
      const reader = new FileReader();
      reader.onload = (event) => {
        document.getElementById('inputArea').value = event.target.result;
        showNotification('Файл загружен');
        updateStats(extractNumbers(event.target.result));
      };
      reader.readAsText(file);
    }
  });

  updateHistoryDisplay();
</script>

</body>
</html>
